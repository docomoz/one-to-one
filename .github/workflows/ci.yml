# Проверки на каждый PR: тесты пакета и сборка приложения.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Новый push в ветку PR отменяет старый запуск: macOS-минуты дорогие. В main каждый запуск доводим до конца.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  ci:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Xcode закреплён, чтобы обновление образа раннера не ломало сборку. Меняем версию осознанно.
      - name: Выбрать Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Версии инструментов
        run: |
          xcodebuild -version
          swift --version

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Тесты пакета
        working-directory: Packages/OneToOneKit
        run: swift test

      - name: Сгенерировать проект
        run: |
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          xcodegen generate

      # Собираем приложение и его тесты, но не запускаем симулятор: его загрузка на раннере занимает от 1 до 10 минут,
      # а сами тесты приложения пока идут доли секунды. `build-for-testing` компилирует и тесты, так что сломанный тест
      # всё равно уронит CI. Запускаем тесты App/OneToOneTests локально (см. CLAUDE.md).
      # Вернуть `xcodebuild test` с `-destination 'platform=iOS Simulator,name=iPhone 17'`, когда появятся настоящие тесты экранов.
      - name: Сборка приложения и тестов
        run: |
          xcodebuild build-for-testing \
            -project OneToOne.xcodeproj \
            -scheme OneToOne \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
