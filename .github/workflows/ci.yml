# Проверки на каждый PR: тесты пакета и тесты приложения на симуляторе.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Новый push в ту же ветку отменяет старый запуск: macOS-минуты дорогие.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Версии инструментов
        run: |
          xcodebuild -version
          swift --version

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Тесты пакета
        working-directory: Packages/OneToOneKit
        run: swift test

      - name: Сгенерировать проект
        run: |
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          xcodegen generate

      - name: Тесты приложения
        run: |
          xcodebuild test \
            -project OneToOne.xcodeproj \
            -scheme OneToOne \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
