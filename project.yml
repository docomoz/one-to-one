# Описание Xcode-проекта. OneToOne.xcodeproj генерируется командой `xcodegen generate` и в git не хранится.
name: OneToOne
options:
  bundleIdPrefix: com.docomoz
  developmentLanguage: ru # язык разработки; ключ developmentRegion XcodeGen молча игнорирует
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  OneToOneKit:
    path: Packages/OneToOneKit
  # Официальная библиотека Appwrite для входа и данных пары (docs/decisions.md). Версия точная:
  # Package.resolved в git нет, а новая версия SDK может требовать более новый сервер.
  Appwrite:
    url: https://github.com/appwrite/sdk-for-apple
    exactVersion: 20.0.0
targets:
  OneToOne:
    type: application
    platform: iOS
    sources: [App/OneToOne]
    # XcodeGen создаёт этот файл сам; Xcode дополняет его ключами из INFOPLIST_KEY_… ниже.
    info:
      path: Config/Info.plist
      properties:
        # Ключ из Config/Secrets.xcconfig. Нет файла — ключ пустой, и поиск фильмов покажет ошибку.
        KinopoiskAPIKey: $(KINOPOISK_API_KEY)
        # Адрес сервера и id проекта Appwrite из Config/App.xcconfig.
        AppwriteEndpoint: $(APPWRITE_ENDPOINT)
        AppwriteProjectID: $(APPWRITE_PROJECT_ID)
        # Иначе XcodeGen впишет 1.0 и 1 вместо MARKETING_VERSION и CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docomoz.onetoone
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: one-to-one
        # Иконка из Icon Composer: App/OneToOne/AppIcon.icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Камера только для QR при передаче ключа пары вживую (Features/Pairing/QRScannerView.swift).
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы отсканировать QR-код с телефона партнёра, когда вы передаёте ключ пары."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - package: OneToOneKit
        product: Core
      - package: OneToOneKit
        product: MovieAPI
      - package: OneToOneKit
        product: DesignSystem
      - package: OneToOneKit
        product: Sync
      - package: Appwrite
        product: Appwrite
  OneToOneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/OneToOneTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OneToOne
schemes:
  OneToOne:
    build:
      targets:
        OneToOne: all
    test:
      targets:
        # Тесты пакета здесь не подключаем: они идут через `swift test`, иначе прогоняются дважды.
        - OneToOneTests
